<style>/* Novuscampo — design tokens
   Editorial · sober. Paper, ink, terracotta. */

:root {
  /* Surfaces (paper) */
  --paper: #f4ecdb;
  --paper-2: #ece1c6;          /* slightly darker; rows, cards */
  --paper-3: #e2d5b3;          /* deepest cream; section bg */
  --paper-card: #fbf6ea;       /* lifted card */

  /* Ink */
  --ink: #1c1814;
  --ink-1: #3a3127;
  --ink-2: #6b5f4e;
  --ink-3: #968a76;
  --ink-4: #b8ad97;

  /* Hairlines */
  --rule: #d4c6a4;
  --rule-soft: #e1d4b3;

  /* Brand */
  --terra: #8b3a2c;            /* primary accent */
  --terra-deep: #5e2719;
  --terra-tint: #d8a99c;
  --terra-wash: #f3dcd2;

  /* Semantic */
  --olive: #5a6440;            /* verified, healthy */
  --olive-wash: #d8dcc1;
  --amber: #a67220;            /* pending, alert mild */
  --amber-wash: #f0e1bf;
  --crimson: #8a2a26;          /* rejected, hard alert */
  --wa: #1faa56;               /* WhatsApp green – sparingly */
  --wa-deep: #157a3e;

  /* Type */
  --serif: "Newsreader", "Source Serif 4", Georgia, serif;
  --sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;

  /* Radii — restrained */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
}

/* Dark mode override */
[data-theme="dark"] {
  --paper: #1a1612;
  --paper-2: #221d18;
  --paper-3: #100c08;
  --paper-card: #25201a;
  --ink: #f1e8d3;
  --ink-1: #d6caaf;
  --ink-2: #9f927a;
  --ink-3: #6f6450;
  --ink-4: #4a4234;
  --rule: #3a3127;
  --rule-soft: #2a241d;
  --terra: #c97a5f;
  --terra-deep: #e0a18a;
  --terra-tint: #6e3022;
  --terra-wash: #3a1d14;
  --olive: #a4b27e;
  --olive-wash: #2c3220;
  --amber: #d4a35a;
  --amber-wash: #3a2c16;
  --paper-card: #25201a;
}

/* Reusable utility classes ----------------------------------- */
.nc-screen {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-feature-settings: "ss01", "cv11";
  height: 100%;
  overflow-y: auto;
}
.nc-screen *::-webkit-scrollbar { display: none; }
.nc-screen * { scrollbar-width: none; }

.nc-h1 { font-family: var(--serif); font-weight: 500; font-size: 32px; line-height: 1.05; letter-spacing: -0.01em; color: var(--ink); }
.nc-h2 { font-family: var(--serif); font-weight: 500; font-size: 24px; line-height: 1.1; letter-spacing: -0.005em; }
.nc-h3 { font-family: var(--serif); font-weight: 500; font-size: 18px; line-height: 1.2; }
.nc-eyebrow {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-2);
}
.nc-body { font-family: var(--sans); font-size: 14px; line-height: 1.45; color: var(--ink-1); }
.nc-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-2); letter-spacing: 0.02em; }
.nc-num  { font-family: var(--mono); font-feature-settings: "tnum"; }

.nc-rule { height: 1px; background: var(--rule); width: 100%; }
.nc-rule-soft { height: 1px; background: var(--rule-soft); width: 100%; }

.nc-btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; height: 48px; padding: 0 18px;
  background: var(--ink); color: var(--paper);
  border: none; cursor: pointer;
  font-family: var(--sans); font-weight: 500; font-size: 15px;
  border-radius: var(--r-sm); letter-spacing: 0.01em;
}
.nc-btn--terra { background: var(--terra); color: var(--paper); }
.nc-btn--ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule); }
.nc-btn--wa { background: var(--wa); color: #fff; }

.nc-chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px;
  border-radius: 999px;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  font-family: var(--sans); font-size: 12px; color: var(--ink-1);
  white-space: nowrap;
}
.nc-chip--active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.nc-chip--terra { background: var(--terra-wash); color: var(--terra-deep); border-color: var(--terra-tint); }
.nc-chip--olive { background: var(--olive-wash); color: var(--olive); border-color: var(--olive); }
.nc-chip--amber { background: var(--amber-wash); color: var(--amber); border-color: var(--amber); }

.nc-tag {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink-2);
  padding: 3px 6px; border: 1px solid var(--rule);
  border-radius: var(--r-xs); background: transparent; line-height: 1;
}

.nc-input {
  width: 100%; height: 48px;
  padding: 0 14px;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: var(--r-sm);
  font-family: var(--sans); font-size: 15px; color: var(--ink);
  box-sizing: border-box;
}
.nc-input::placeholder { color: var(--ink-3); }

.nc-label {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--ink-2);
  display: block; margin-bottom: 6px;
}

.nc-card {
  background: var(--paper-card);
  border: 1px solid var(--rule-soft);
  border-radius: var(--r-md);
}

/* Verified ear-tag chip */
.nc-verified {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--olive);
  padding: 3px 6px; border: 1px solid var(--olive);
  border-radius: var(--r-xs); line-height: 1; background: transparent;
}

/* Newsprint texture for hero backgrounds */
.nc-newsprint {
  background-color: var(--paper);
  background-image:
    radial-gradient(rgba(28,24,20,0.045) 1px, transparent 1px),
    radial-gradient(rgba(28,24,20,0.035) 1px, transparent 1px);
  background-size: 3px 3px, 7px 7px;
  background-position: 0 0, 2px 2px;
}

/* Placeholder image — diagonal stripes */
.nc-ph {
  background-color: var(--paper-2);
  background-image: repeating-linear-gradient(
    135deg,
    var(--paper-2) 0px, var(--paper-2) 6px,
    var(--paper-3) 6px, var(--paper-3) 7px
  );
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-3);
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase;
}

/* Brand wordmark monogram */
.nc-mark {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--terra);
  color: var(--paper);
  font-family: var(--serif);
  font-style: italic;
  font-weight: 500;
  border-radius: 2px;
  letter-spacing: -0.02em;
}
.nc-wordmark {
  font-family: var(--serif);
  font-weight: 500;
  letter-spacing: -0.01em;
  font-style: italic;
}
</style>

  <style>
    /* Prototype shell */
    html, body { margin: 0; padding: 0; min-height: 100vh; background: #f0eee9; font-family: "DM Sans", system-ui, sans-serif; color: #1c1814; }
    #root { width: 100%; min-height: 100vh; }
    ::selection { background: rgba(139,58,44,0.22); }
    button { font-family: inherit; }

    .proto-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    .proto-nav {
      background: #1c1814;
      color: #f4ecdb;
      padding: 24px 0;
      position: sticky; top: 0;
      height: 100vh; overflow-y: auto;
      border-right: 1px solid rgba(244,236,219,0.12);
    }
    .proto-nav-header { padding: 0 22px 18px; border-bottom: 1px solid rgba(244,236,219,0.12); }
    .proto-nav-mark {
      width: 26px; height: 20px; background: #8b3a2c; border-radius: 2px;
      display: inline-flex; align-items: center; justify-content: center;
      font-family: "Newsreader", serif; font-style: italic; font-size: 12px; color: #f4ecdb;
    }
    .proto-nav-brand {
      display: flex; align-items: center; gap: 10px;
      font-family: "Newsreader", serif; font-style: italic; font-size: 17px;
    }
    .proto-nav-sub {
      margin-top: 6px;
      font-family: "JetBrains Mono", monospace;
      font-size: 9.5px; color: rgba(244,236,219,0.5); letter-spacing: 0.1em; text-transform: uppercase;
    }
    .proto-nav-section {
      padding: 16px 22px 6px;
      font-family: "JetBrains Mono", monospace;
      font-size: 9.5px; color: rgba(244,236,219,0.4); letter-spacing: 0.14em; text-transform: uppercase;
    }
    .proto-nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 22px;
      font-family: "DM Sans", sans-serif; font-size: 13.5px;
      color: rgba(244,236,219,0.7);
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .proto-nav-item:hover { background: rgba(244,236,219,0.04); color: #f4ecdb; }
    .proto-nav-item.active {
      background: rgba(244,236,219,0.08);
      color: #f4ecdb;
      border-left-color: #8b3a2c;
      font-weight: 500;
    }
    .proto-nav-item-num {
      font-family: "JetBrains Mono", monospace; font-size: 10px;
      color: rgba(244,236,219,0.4); width: 18px;
    }
    .proto-nav-item.active .proto-nav-item-num { color: #c97a5f; }
    .proto-nav-footer {
      margin-top: 12px; padding: 14px 22px 4px;
      font-family: "JetBrains Mono", monospace; font-size: 10px;
      color: rgba(244,236,219,0.4); line-height: 1.5;
      border-top: 1px solid rgba(244,236,219,0.12);
    }
    .proto-nav-footer a { color: #c97a5f; }

    .proto-stage {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 20px;
      background: #f0eee9;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .proto-stage-header {
      width: 100%; max-width: 1400px;
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 22px;
    }
    .proto-stage-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
      color: #6b5f4e;
    }
    .proto-stage-title {
      font-family: "Newsreader", serif; font-style: italic; font-weight: 500;
      font-size: 22px; color: #1c1814;
    }
    .proto-hint {
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px; color: #968a76; letter-spacing: 0.02em;
    }

    /* Phone frame */
    .proto-phone {
      width: 390px; height: 844px;
      border-radius: 50px;
      border: 11px solid #18130d;
      background: #000;
      overflow: hidden;
      position: relative;
      box-shadow: 0 30px 70px rgba(28,24,20,0.22), 0 0 0 1px rgba(28,24,20,0.15);
    }
    .proto-phone::before {
      content: ""; position: absolute;
      top: 12px; left: 50%; transform: translateX(-50%);
      width: 110px; height: 28px;
      background: #000; border-radius: 16px;
      z-index: 100;
    }
    .proto-phone-inner {
      width: 100%; height: 100%;
      position: relative; overflow: hidden;
      background: var(--paper);
    }

    /* Desktop frame for admin */
    .proto-desktop {
      width: 100%; max-width: 1440px;
      overflow: auto; border-radius: 8px;
      box-shadow: 0 30px 70px rgba(28,24,20,0.22), 0 0 0 1px rgba(28,24,20,0.15);
    }

    /* Hide design tweaks panel from the original — we don't use it */
    .nc-tweaks-panel { display: none !important; }



    /* User mode floating controls (back + restart) */
    .proto-user-controls {
      position: fixed;
      top: 24px; right: 24px;
      display: flex; gap: 8px;
      z-index: 100;
    }
    .proto-ctrl {
      display: inline-flex; align-items: center; gap: 6px;
      height: 36px; padding: 0 14px;
      background: rgba(244,236,219,0.92);
      backdrop-filter: blur(8px);
      color: #1c1814;
      border: 1px solid rgba(28,24,20,0.18);
      border-radius: 999px;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 12.5px; font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .proto-ctrl:hover:not(:disabled) { background: rgba(244,236,219,1); }
    .proto-ctrl:active:not(:disabled) { transform: translateY(1px); }
    .proto-ctrl:disabled { opacity: 0.4; cursor: not-allowed; }

    /* User mode — clean app experience (no chrome) */
    .proto-user-mode {
      width: 100%;
      min-height: 100vh;
      background: #1c1814;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
    }
    .proto-user-phone {
      width: 390px; height: 844px;
      border-radius: 50px;
      border: 11px solid #18130d;
      background: #000;
      overflow: hidden;
      position: relative;
      box-shadow: 0 30px 70px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,0,0,0.5);
    }
    .proto-user-phone::before {
      content: ""; position: absolute;
      top: 12px; left: 50%; transform: translateX(-50%);
      width: 110px; height: 28px;
      background: #000; border-radius: 16px;
      z-index: 100;
    }

    /* ===== MOBILE FIXES ===== */
    /* On phones, kill body scroll, fix viewport, allow only .nc-screen to scroll. */
    @media (max-width: 480px) {
      html, body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        height: 100%;
        overflow: hidden;
      }

      .proto-user-mode {
        background: var(--paper);
        padding: 0;
        min-height: 100dvh;
        height: 100dvh;
        display: block;
      }
      .proto-user-phone {
        width: 100vw;
        height: 100dvh;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
      .proto-user-phone::before { display: none; }

      /* Floating controls: top-right with safe-area for notch/status bar */
      .proto-user-controls {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        right: 12px;
        bottom: auto; left: auto;
        gap: 6px;
        z-index: 200;
      }
      .proto-ctrl {
        height: 36px;
        padding: 0 12px;
        font-size: 12px;
        background: rgba(28,24,20,0.88);
        color: #f4ecdb;
        border-color: rgba(244,236,219,0.2);
      }
      .proto-ctrl:hover:not(:disabled) { background: rgba(28,24,20,1); }

      /* Make the scrollable screen actually scroll smoothly on mobile */
      .nc-screen {
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }

      /* Sticky CTAs at the bottom of screens need extra padding for the
         safe-area (gesture bar) AND so the last bit of scroll content
         doesn't get hidden under them. */
      .nc-screen > div[style*="position: absolute"][style*="bottom: 0"] {
        padding-bottom: calc(20px + env(safe-area-inset-bottom, 16px)) !important;
      }

      /* Ensure the screen content has room below the sticky CTA */
      .nc-screen {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
    }

        /* Hide design tweaks panel from the original — we don't use it */
    .nc-tweaks-panel { display: none !important; }



    @media (max-width: 900px) {
      .proto-layout { grid-template-columns: 1fr; }
      .proto-nav { position: relative; height: auto; }
      .proto-stage { padding: 20px 10px; }
      .proto-phone { transform: scale(0.85); transform-origin: top center; }
    }
  </style>

// TrustNotches — visual representation of confidence level (0-5)
function TrustNotches({ level = 0, max = 5, label, size = 'sm' }) {
  const cells = [];
  for (let i = 0; i < max; i++) {
    cells.push(i < level);
  }
  const heights = size === 'lg' ? 14 : 10;
  const widths = size === 'lg' ? 4 : 3;
  const gap = size === 'lg' ? 3 : 2;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 6,
      fontFamily: 'var(--mono)', fontSize: size === 'lg' ? 11 : 9.5,
      letterSpacing: 0.04, color: 'var(--ink-2)',
    }}>
      <span style={{ display: 'inline-flex', gap: gap, alignItems: 'flex-end' }}>
        {cells.map((on, i) => (
          <span key={i} style={{
            width: widths, height: heights * (0.5 + (i + 1) * 0.1),
            background: on ? 'var(--olive)' : 'var(--rule)',
            borderRadius: 1,
          }} />
        ))}
      </span>
      {label !== false && (
        <span>{level}/{max}{label ? ' · ' + label : ''}</span>
      )}
    </span>
  );
}

}

Object.assign(window, { ScreenAdmin });

  </script>

  <!-- Router + App entry -->
  <script type="text/babel">
    // Stub IOSDevice used by NCScreen — replace the bundler's version
    function IOSDevice({ children }) {
      // Always fill the parent container. The parent
      // (.proto-phone or .proto-user-phone) sets the actual size.
      return (
        <div style={{
          width: '100%', height: '100%',
          position: 'relative', overflow: 'hidden',
          background: 'var(--paper)',
        }}>
          {children}
        </div>
      );
    }
    window.IOSDevice = IOSDevice;

    // Map of screen id → { component, label, section, isDesktop }
    const SCREENS = [
      { id: 'splash',       label: 'Splash',                num: '01', section: 'Onboarding',     fn: () => <ScreenSplash /> },
      { id: 'registro',     label: 'Registro',              num: '02', section: 'Onboarding',     fn: () => <ScreenRegistro /> },
      { id: 'verificacion', label: 'Verificación',          num: '03', section: 'Onboarding',     fn: () => <ScreenVerificacion /> },
      { id: 'home',         label: 'Mercado',               num: '04', section: 'Flujo comprador', fn: () => <ScreenHome density="grid" verified={true} /> },
      { id: 'filtros',      label: 'Filtros',               num: '05', section: 'Flujo comprador', fn: () => <ScreenFiltros /> },
      { id: 'detalle',      label: 'Detalle del lote',      num: '06', section: 'Flujo comprador', fn: () => <ScreenDetalle /> },
      { id: 'pre-contacto', label: 'Pre-contacto WhatsApp', num: '07', section: 'Flujo comprador', fn: () => <ScreenPreContactoWhatsApp /> },
      { id: 'perfil-finca', label: 'Perfil de finca',       num: '08', section: 'Flujo productor', fn: () => <ScreenPerfilFinca /> },
      { id: 'crear',        label: 'Crear publicación',     num: '09', section: 'Flujo productor', fn: () => <ScreenCrearPublicacion /> },
      { id: 'solicitudes',  label: 'Bandeja de contactos',  num: '10', section: 'Flujo productor', fn: () => <ScreenSolicitudes /> },
      { id: 'aprobacion',   label: 'Perfil del comprador',  num: '11', section: 'Flujo productor', fn: () => <ScreenAprobacion /> },
      { id: 'admin',        label: 'Panel admin',           num: '12', section: 'Administración',  fn: () => <ScreenAdmin />, isDesktop: true },
    ];

    function DemoNavigator({ current, onNavigate }) {
      const sections = [...new Set(SCREENS.map(s => s.section))];
      return (
        <aside className="proto-nav">
          <div className="proto-nav-header">
            <div className="proto-nav-brand">
              <span className="proto-nav-mark">nc</span>
              <span>novuscampo</span>
            </div>
            <div className="proto-nav-sub">Prototipo navegable · v0.2</div>
          </div>

          {sections.map(sec => (
            <div key={sec}>
              <div className="proto-nav-section">{sec}</div>
              {SCREENS.filter(s => s.section === sec).map(s => (
                <div
                  key={s.id}
                  className={'proto-nav-item' + (s.id === current ? ' active' : '')}
                  onClick={() => onNavigate(s.id)}
                >
                  <span className="proto-nav-item-num">{s.num}</span>
                  <span>{s.label}</span>
                </div>
              ))}
            </div>
          ))}

          <div className="proto-nav-footer">
            Use el menú lateral para saltar entre pantallas, o los botones dentro del prototipo para navegar como un usuario real.
            <br/><br/>
            Los botones de WhatsApp muestran un mensaje en lugar de abrir la app.
          </div>
        </aside>
      );
    }

    function App() {
      // Mode detection
      const isDemoMode = typeof window !== 'undefined' &&
        new URLSearchParams(window.location.search).has('demo');

      const [screen, setScreen] = React.useState('splash');
      const [history, setHistory] = React.useState([]);

      // Expose navigation globally
      React.useEffect(() => {
        window.__nav = (s) => {
          // In user mode, block admin
          if (!isDemoMode && s === 'admin') return;
          if (!SCREENS.find(x => x.id === s)) return;
          setHistory(h => [...h, screen]);
          setScreen(s);
        };
        window.__back = () => {
          setHistory(h => {
            if (h.length === 0) { setScreen('splash'); return []; }
            const last = h[h.length - 1];
            setScreen(last);
            return h.slice(0, -1);
          });
        };
      }, [screen, isDemoMode]);

      const current = SCREENS.find(s => s.id === screen);

      // === DEMO MODE — sidebar + screen labels (for investors/team) ===
      if (isDemoMode) {
        const sections = [...new Set(SCREENS.map(s => s.section))];
        const stageHint = history.length > 0
          ? `← desde ${SCREENS.find(s => s.id === history[history.length - 1])?.label || 'inicio'}`
          : 'pantalla inicial';

        return (
          <div className="proto-layout">
            <aside className="proto-nav">
              <div className="proto-nav-header">
                <div className="proto-nav-brand">
                  <span className="proto-nav-mark">nc</span>
                  <span>novuscampo</span>
                </div>
                <div className="proto-nav-sub">Modo presentación · v0.2</div>
              </div>
              {sections.map(sec => (
                <div key={sec}>
                  <div className="proto-nav-section">{sec}</div>
                  {SCREENS.filter(s => s.section === sec).map(s => (
                    <div key={s.id}
                      className={'proto-nav-item' + (s.id === screen ? ' active' : '')}
                      onClick={() => { setScreen(s.id); setHistory([]); }}>
                      <span className="proto-nav-item-num">{s.num}</span>
                      <span>{s.label}</span>
                    </div>
                  ))}
                </div>
              ))}
              <div className="proto-nav-footer">
                Esta vista es solo para presentaciones internas e inversores.
                Para mostrar a usuarios reales, use el link sin <code>?demo=1</code>.
              </div>
            </aside>
            <div className="proto-stage">
              <div className="proto-stage-header">
                <div>
                  <div className="proto-stage-label">{current.section}</div>
                  <div className="proto-stage-title">{current.num} · {current.label}</div>
                </div>
                <div className="proto-hint">{stageHint}</div>
              </div>
              {current.isDesktop ? (
                <div className="proto-desktop">{current.fn()}</div>
              ) : (
                <div className="proto-phone">
                  <div className="proto-phone-inner">{current.fn()}</div>
                </div>
              )}
            </div>
          </div>
        );
      }

      // === USER MODE — clean app experience (no chrome) ===
      if (current.isDesktop) {
        // Admin not accessible in user mode — fallback to splash
        setTimeout(() => setScreen('splash'), 0);
        return null;
      }

      const canGoBack = history.length > 0;
      const restart = () => { setScreen('splash'); setHistory([]); };

      return (
        <div className="proto-user-mode">
          <div className="proto-user-controls">
            <button
              className="proto-ctrl"
              onClick={() => window.__back && window.__back()}
              disabled={!canGoBack}
              title="Volver"
              aria-label="Volver">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M9 2 L4 7 L9 12" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
              Atrás
            </button>
            <button
              className="proto-ctrl"
              onClick={restart}
              title="Reiniciar recorrido"
              aria-label="Reiniciar recorrido">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M2 7 a5 5 0 1 0 1.5 -3.5 M2 2 v3 h3" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
              Inicio
            </button>
          </div>
          <div className="proto-user-phone">
            <div className="proto-phone-inner">{current.fn()}</div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

<script>
