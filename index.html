<style>/* Novuscampo — design tokens
   Editorial · sober · llanero. Paper, ink, terracotta. */

:root {
  /* Surfaces (paper) */
  --paper: #f4ecdb;
  --paper-2: #ece1c6;          /* slightly darker; rows, cards */
  --paper-3: #e2d5b3;          /* deepest cream; section bg */
  --paper-card: #fbf6ea;       /* lifted card */

  /* Ink */
  --ink: #1c1814;
  --ink-1: #3a3127;
  --ink-2: #6b5f4e;
  --ink-3: #968a76;
  --ink-4: #b8ad97;

  /* Hairlines */
  --rule: #d4c6a4;
  --rule-soft: #e1d4b3;

  /* Brand */
  --terra: #8b3a2c;            /* primary accent */
  --terra-deep: #5e2719;
  --terra-tint: #d8a99c;
  --terra-wash: #f3dcd2;

  /* Semantic */
  --olive: #5a6440;            /* verified, healthy */
  --olive-wash: #d8dcc1;
  --amber: #a67220;            /* pending, alert mild */
  --amber-wash: #f0e1bf;
  --crimson: #8a2a26;          /* rejected, hard alert */
  --wa: #1faa56;               /* WhatsApp green – sparingly */
  --wa-deep: #157a3e;

  /* Type */
  --serif: "Newsreader", "Source Serif 4", Georgia, serif;
  --sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;

  /* Radii — restrained */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
}

/* Dark mode override */
[data-theme="dark"] {
  --paper: #1a1612;
  --paper-2: #221d18;
  --paper-3: #100c08;
  --paper-card: #25201a;
  --ink: #f1e8d3;
  --ink-1: #d6caaf;
  --ink-2: #9f927a;
  --ink-3: #6f6450;
  --ink-4: #4a4234;
  --rule: #3a3127;
  --rule-soft: #2a241d;
  --terra: #c97a5f;
  --terra-deep: #e0a18a;
  --terra-tint: #6e3022;
  --terra-wash: #3a1d14;
  --olive: #a4b27e;
  --olive-wash: #2c3220;
  --amber: #d4a35a;
  --amber-wash: #3a2c16;
  --paper-card: #25201a;
}

/* Reusable utility classes ----------------------------------- */
.nc-screen {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-feature-settings: "ss01", "cv11";
  height: 100%;
  overflow-y: auto;
}
.nc-screen *::-webkit-scrollbar { display: none; }
.nc-screen * { scrollbar-width: none; }

.nc-h1 { font-family: var(--serif); font-weight: 500; font-size: 32px; line-height: 1.05; letter-spacing: -0.01em; color: var(--ink); }
.nc-h2 { font-family: var(--serif); font-weight: 500; font-size: 24px; line-height: 1.1; letter-spacing: -0.005em; }
.nc-h3 { font-family: var(--serif); font-weight: 500; font-size: 18px; line-height: 1.2; }
.nc-eyebrow {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-2);
}
.nc-body { font-family: var(--sans); font-size: 14px; line-height: 1.45; color: var(--ink-1); }
.nc-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-2); letter-spacing: 0.02em; }
.nc-num  { font-family: var(--mono); font-feature-settings: "tnum"; }

.nc-rule { height: 1px; background: var(--rule); width: 100%; }
.nc-rule-soft { height: 1px; background: var(--rule-soft); width: 100%; }

.nc-btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; height: 48px; padding: 0 18px;
  background: var(--ink); color: var(--paper);
  border: none; cursor: pointer;
  font-family: var(--sans); font-weight: 500; font-size: 15px;
  border-radius: var(--r-sm); letter-spacing: 0.01em;
}
.nc-btn--terra { background: var(--terra); color: var(--paper); }
.nc-btn--ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule); }
.nc-btn--wa { background: var(--wa); color: #fff; }

.nc-chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px;
  border-radius: 999px;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  font-family: var(--sans); font-size: 12px; color: var(--ink-1);
  white-space: nowrap;
}
.nc-chip--active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.nc-chip--terra { background: var(--terra-wash); color: var(--terra-deep); border-color: var(--terra-tint); }
.nc-chip--olive { background: var(--olive-wash); color: var(--olive); border-color: var(--olive); }
.nc-chip--amber { background: var(--amber-wash); color: var(--amber); border-color: var(--amber); }

.nc-tag {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink-2);
  padding: 3px 6px; border: 1px solid var(--rule);
  border-radius: var(--r-xs); background: transparent; line-height: 1;
}

.nc-input {
  width: 100%; height: 48px;
  padding: 0 14px;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  border-radius: var(--r-sm);
  font-family: var(--sans); font-size: 15px; color: var(--ink);
  box-sizing: border-box;
}
.nc-input::placeholder { color: var(--ink-3); }

.nc-label {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--ink-2);
  display: block; margin-bottom: 6px;
}

.nc-card {
  background: var(--paper-card);
  border: 1px solid var(--rule-soft);
  border-radius: var(--r-md);
}

/* Verified ear-tag chip */
.nc-verified {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--olive);
  padding: 3px 6px; border: 1px solid var(--olive);
  border-radius: var(--r-xs); line-height: 1; background: transparent;
}

/* Newsprint texture for hero backgrounds */
.nc-newsprint {
  background-color: var(--paper);
  background-image:
    radial-gradient(rgba(28,24,20,0.045) 1px, transparent 1px),
    radial-gradient(rgba(28,24,20,0.035) 1px, transparent 1px);
  background-size: 3px 3px, 7px 7px;
  background-position: 0 0, 2px 2px;
}

/* Placeholder image — diagonal stripes */
.nc-ph {
  background-color: var(--paper-2);
  background-image: repeating-linear-gradient(
    135deg,
    var(--paper-2) 0px, var(--paper-2) 6px,
    var(--paper-3) 6px, var(--paper-3) 7px
  );
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-3);
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase;
}

/* Brand wordmark monogram */
.nc-mark {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--terra);
  color: var(--paper);
  font-family: var(--serif);
  font-style: italic;
  font-weight: 500;
  border-radius: 2px;
  letter-spacing: -0.02em;
}
.nc-wordmark {
  font-family: var(--serif);
  font-weight: 500;
  letter-spacing: -0.01em;
  font-style: italic;
}
</style>

  <style>
    /* Prototype shell */
    html, body { margin: 0; padding: 0; min-height: 100vh; background: #f0eee9; font-family: "DM Sans", system-ui, sans-serif; color: #1c1814; }
    #root { width: 100%; min-height: 100vh; }
    ::selection { background: rgba(139,58,44,0.22); }
    button { font-family: inherit; }

    .proto-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    .proto-nav {
      background: #1c1814;
      color: #f4ecdb;
      padding: 24px 0;
      position: sticky; top: 0;
      height: 100vh; overflow-y: auto;
      border-right: 1px solid rgba(244,236,219,0.12);
    }
    .proto-nav-header { padding: 0 22px 18px; border-bottom: 1px solid rgba(244,236,219,0.12); }
    .proto-nav-mark {
      width: 26px; height: 20px; background: #8b3a2c; border-radius: 2px;
      display: inline-flex; align-items: center; justify-content: center;
      font-family: "Newsreader", serif; font-style: italic; font-size: 12px; color: #f4ecdb;
    }
    .proto-nav-brand {
      display: flex; align-items: center; gap: 10px;
      font-family: "Newsreader", serif; font-style: italic; font-size: 17px;
    }
    .proto-nav-sub {
      margin-top: 6px;
      font-family: "JetBrains Mono", monospace;
      font-size: 9.5px; color: rgba(244,236,219,0.5); letter-spacing: 0.1em; text-transform: uppercase;
    }
    .proto-nav-section {
      padding: 16px 22px 6px;
      font-family: "JetBrains Mono", monospace;
      font-size: 9.5px; color: rgba(244,236,219,0.4); letter-spacing: 0.14em; text-transform: uppercase;
    }
    .proto-nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 22px;
      font-family: "DM Sans", sans-serif; font-size: 13.5px;
      color: rgba(244,236,219,0.7);
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .proto-nav-item:hover { background: rgba(244,236,219,0.04); color: #f4ecdb; }
    .proto-nav-item.active {
      background: rgba(244,236,219,0.08);
      color: #f4ecdb;
      border-left-color: #8b3a2c;
      font-weight: 500;
    }
    .proto-nav-item-num {
      font-family: "JetBrains Mono", monospace; font-size: 10px;
      color: rgba(244,236,219,0.4); width: 18px;
    }
    .proto-nav-item.active .proto-nav-item-num { color: #c97a5f; }
    .proto-nav-footer {
      margin-top: 12px; padding: 14px 22px 4px;
      font-family: "JetBrains Mono", monospace; font-size: 10px;
      color: rgba(244,236,219,0.4); line-height: 1.5;
      border-top: 1px solid rgba(244,236,219,0.12);
    }
    .proto-nav-footer a { color: #c97a5f; }

    .proto-stage {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 20px;
      background: #f0eee9;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .proto-stage-header {
      width: 100%; max-width: 1400px;
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 22px;
    }
    .proto-stage-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
      color: #6b5f4e;
    }
    .proto-stage-title {
      font-family: "Newsreader", serif; font-style: italic; font-weight: 500;
      font-size: 22px; color: #1c1814;
    }
    .proto-hint {
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px; color: #968a76; letter-spacing: 0.02em;
    }

    /* Phone frame */
    .proto-phone {
      width: 390px; height: 844px;
      border-radius: 50px;
      border: 11px solid #18130d;
      background: #000;
      overflow: hidden;
      position: relative;
      box-shadow: 0 30px 70px rgba(28,24,20,0.22), 0 0 0 1px rgba(28,24,20,0.15);
    }
    .proto-phone::before {
      content: ""; position: absolute;
      top: 12px; left: 50%; transform: translateX(-50%);
      width: 110px; height: 28px;
      background: #000; border-radius: 16px;
      z-index: 100;
    }
    .proto-phone-inner {
      width: 100%; height: 100%;
      position: relative; overflow: hidden;
      background: var(--paper);
    }

    /* Desktop frame for admin */
    .proto-desktop {
      width: 100%; max-width: 1440px;
      overflow: auto; border-radius: 8px;
      box-shadow: 0 30px 70px rgba(28,24,20,0.22), 0 0 0 1px rgba(28,24,20,0.15);
    }

    /* Hide design tweaks panel from the original — we don't use it */
    .nc-tweaks-panel { display: none !important; }

    @media (max-width: 900px) {
      .proto-layout { grid-template-columns: 1fr; }
      .proto-nav { position: relative; height: auto; }
      .proto-stage { padding: 20px 10px; }
      .proto-phone { transform: scale(0.85); transform-origin: top center; }
    }
  </style>

  <!-- Shared shell components -->
  <script type="text/babel">
// shell.jsx — shared mobile chrome (top bar, bottom tab bar, placeholder photo)

function NCTopBar({ title, subtitle, back = true, action }) {
  return (
    <div style={{
      position: 'sticky', top: 0, zIndex: 5,
      background: 'var(--paper)',
      borderBottom: '1px solid var(--rule-soft)',
      paddingTop: 54, // status bar
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '10px 16px 6px',
      }}>
        {back ? (
          <button onClick={() => window.__back && window.__back()} style={{
            width: 36, height: 36, borderRadius: 999,
            border: '1px solid var(--rule)', background: 'var(--paper-card)',
            display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0,
            cursor: 'pointer',
          }}>
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M9 2L4 7l5 5" fill="none" stroke="var(--ink)" strokeWidth="1.8" strokeLinecap="round"/></svg>
          </button>
        ) : <NCMark size={28} />}
        <NCWordmark size={14} />
        <div style={{ width: 36 }}>{action}</div>
      </div>
      <div style={{ padding: '6px 20px 14px' }}>
        {subtitle && <div className="nc-eyebrow" style={{ marginBottom: 4 }}>{subtitle}</div>}
        <div className="nc-h1" style={{ fontSize: 30 }}>{title}</div>
      </div>
    </div>
  );
}

function NCBottomTab({ active = 'home' }) {
  const tabs = [
    { key: 'home',     label: 'Mercado', icon: 'M3 9l7-6 7 6v8a1 1 0 01-1 1h-4v-5h-4v5H4a1 1 0 01-1-1V9z' },
    { key: 'search',   label: 'Buscar',  icon: 'M14 14l3 3m-3-7a4 4 0 11-8 0 4 4 0 018 0z' },
    { key: 'post',     label: 'Publicar', icon: 'M10 4v12m-6-6h12' },
    { key: 'requests', label: 'Solicitudes', icon: 'M3 5h14v9H7l-4 3V5z' },
    { key: 'me',       label: 'Finca',   icon: 'M10 10a3 3 0 100-6 3 3 0 000 6zm-6 7c0-3.3 2.7-6 6-6s6 2.7 6 6' },
  ];
  return (
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
      background: 'var(--paper)',
      borderTop: '1px solid var(--rule)',
      paddingBottom: 28, paddingTop: 8,
      display: 'flex', justifyContent: 'space-around', alignItems: 'flex-start',
    }}>
      {tabs.map(t => {
        const on = t.key === active;
        const post = t.key === 'post';
        const tabRoutes = { home: 'home', search: 'home', post: 'crear', requests: 'solicitudes', me: 'perfil-finca' };
        return (
          <div key={t.key} onClick={() => window.__nav && window.__nav(tabRoutes[t.key] || 'home')} style={{
            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4,
            flex: 1, position: 'relative', cursor: 'pointer',
            color: on ? 'var(--terra)' : 'var(--ink-2)',
          }}>
            {post ? (
              <div style={{
                width: 38, height: 38, borderRadius: 999,
                background: 'var(--terra)', display: 'flex', alignItems: 'center', justifyContent: 'center',
                marginTop: -16, boxShadow: '0 4px 12px rgba(139,58,44,0.3)',
              }}>
                <svg width="18" height="18" viewBox="0 0 20 20"><path d="M10 4v12m-6-6h12" stroke="#f4ecdb" strokeWidth="2" strokeLinecap="round"/></svg>
              </div>
            ) : (
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d={t.icon} stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
            )}
            <span style={{
              fontFamily: 'var(--sans)', fontSize: 10, letterSpacing: 0.02,
              fontWeight: on ? 600 : 400,
              color: on ? 'var(--terra)' : 'var(--ink-2)',
            }}>{t.label}</span>
            {on && !post && <div style={{ position: 'absolute', top: -8, width: 22, height: 2, background: 'var(--terra)' }} />}
          </div>
        );
      })}
    </div>
  );
}

// Cattle photo placeholder — striped paper card with mono label
function NCPhoto({ height = 160, label = 'foto ganado', tag, dark }) {
  return (
    <div className="nc-ph" style={{
      height, width: '100%', borderRadius: 'var(--r-sm)',
      position: 'relative', overflow: 'hidden',
    }}>
      <span>{label}</span>
      {tag && (
        <div style={{
          position: 'absolute', top: 8, left: 8,
          padding: '3px 6px', background: 'rgba(28,24,20,0.78)', color: 'var(--paper)',
          fontFamily: 'var(--mono)', fontSize: 9, letterSpacing: 0.1,
          borderRadius: 3, textTransform: 'uppercase',
        }}>{tag}</div>
      )}
    </div>
  );
}

// Mobile screen wrapper — places content within a phone, applies the screen bg
function NCScreen({ children, tab, noTab, label }) {
  return (
    <IOSDevice width={390} height={844}>
      <div className="nc-screen" data-screen-label={label} style={{ paddingBottom: noTab ? 0 : 84 }}>
        {children}
      </div>
      {!noTab && <NCBottomTab active={tab} />}
    </IOSDevice>
  );
}

// Verified ear-tag chip
function NCEarTag({ children = 'Verificado' }) {
  return (
    <span className="nc-verified">
      <svg width="9" height="9" viewBox="0 0 10 10"><path d="M1 5l3 3 5-6" stroke="currentColor" strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
      {children}
    </span>
  );
}

Object.assign(window, { NCTopBar, NCBottomTab, NCPhoto, NCScreen, NCEarTag });

  </script>

  <!-- Brand system (NCMark, NCWordmark, BrandSystemCard) -->
  <script type="text/babel">
// brand.jsx — Brand system overview card (logo, type, color)

function NCMark({ size = 28 }) {
  return (
    <span
      className="nc-mark"
      style={{
        width: size * 1.4,
        height: size,
        fontSize: size * 0.6,
        paddingBottom: size * 0.05,
      }}
    >
      nc
    </span>
  );
}

function NCWordmark({ size = 22, color }) {
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: size * 0.4 }}>
      <NCMark size={size} />
      <span className="nc-wordmark" style={{ fontSize: size * 1.05, color: color || 'var(--ink)' }}>
        novuscampo
      </span>
    </span>
  );
}

function BrandSystemCard() {
  return (
    <div style={{
      width: 1080, height: 620,
      background: 'var(--paper)',
      padding: '48px 56px',
      boxSizing: 'border-box',
      display: 'grid',
      gridTemplateColumns: '1.1fr 1fr',
      gap: 48,
      fontFamily: 'var(--sans)',
      color: 'var(--ink)',
    }}>
      {/* LEFT: mark + wordmark + voice */}
      <div style={{ display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
        <div>
          <div className="nc-eyebrow" style={{ marginBottom: 20 }}>
            Sistema de marca · v0.1 · Caracas
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 18, marginBottom: 24 }}>
            <NCMark size={64} />
            <div>
              <div className="nc-wordmark" style={{ fontSize: 56, lineHeight: 1, color: 'var(--ink)' }}>
                novuscampo
              </div>
              <div className="nc-meta" style={{ marginTop: 6 }}>
                Comercio ganadero · directo · del llano al hato
              </div>
            </div>

// Utilitario: segmented control 2–3 opciones
function SegmentedControl({ options, active }) {
  return (
    <div style={{
      display: 'flex', padding: 3,
      background: 'var(--paper-card)', border: '1px solid var(--rule)',
      borderRadius: 'var(--r-sm)',
    }}>

        const on = opt === active;
        return (
          <button key={opt} style={{
            flex: 1, padding: '10px 8px',
            background: on ? 'var(--ink)' : 'transparent',
            color: on ? 'var(--paper)' : 'var(--ink-2)',
            border: 'none', borderRadius: 'calc(var(--r-sm) - 2px)',
            fontFamily: 'var(--sans)', fontSize: 13, fontWeight: on ? 600 : 400,
            cursor: 'pointer', lineHeight: 1.15,
          }}>{opt}</button>
        );
      })}
    </div>
  );
}

          background: 'var(--ink)', color: 'var(--paper)',

  </script>

  <!-- Router + App entry -->
  <script type="text/babel">
    // Stub IOSDevice used by NCScreen — replace the bundler's version
    function IOSDevice({ width = 390, height = 844, children }) {
      return (
        <div style={{
          width: width, height: height,
          position: 'relative', overflow: 'hidden',
          background: 'var(--paper)',
        }}>
          {children}
        </div>
      );
    }
    window.IOSDevice = IOSDevice;

    // Map of screen id → { component, label, section, isDesktop }
    const SCREENS = [
      { id: 'splash',       label: 'Splash',                num: '01', section: 'Onboarding',     fn: () => <ScreenSplash /> },
      { id: 'registro',     label: 'Registro',              num: '02', section: 'Onboarding',     fn: () => <ScreenRegistro /> },
      { id: 'verificacion', label: 'Verificación',          num: '03', section: 'Onboarding',     fn: () => <ScreenVerificacion /> },
      { id: 'home',         label: 'Mercado',               num: '04', section: 'Flujo comprador', fn: () => <ScreenHome density="grid" verified={true} /> },
      { id: 'filtros',      label: 'Filtros',               num: '05', section: 'Flujo comprador', fn: () => <ScreenFiltros /> },
      { id: 'detalle',      label: 'Detalle del lote',      num: '06', section: 'Flujo comprador', fn: () => <ScreenDetalle /> },
      { id: 'pre-contacto', label: 'Pre-contacto WhatsApp', num: '07', section: 'Flujo comprador', fn: () => <ScreenPreContactoWhatsApp /> },
      { id: 'perfil-finca', label: 'Perfil de finca',       num: '08', section: 'Flujo productor', fn: () => <ScreenPerfilFinca /> },
      { id: 'crear',        label: 'Crear publicación',     num: '09', section: 'Flujo productor', fn: () => <ScreenCrearPublicacion /> },
      { id: 'solicitudes',  label: 'Bandeja de contactos',  num: '10', section: 'Flujo productor', fn: () => <ScreenSolicitudes /> },
      { id: 'aprobacion',   label: 'Perfil del comprador',  num: '11', section: 'Flujo productor', fn: () => <ScreenAprobacion /> },
      { id: 'admin',        label: 'Panel admin',           num: '12', section: 'Administración',  fn: () => <ScreenAdmin />, isDesktop: true },
    ];

    function DemoNavigator({ current, onNavigate }) {
      const sections = [...new Set(SCREENS.map(s => s.section))];
      return (
        <aside className="proto-nav">
          <div className="proto-nav-header">
            <div className="proto-nav-brand">
              <span className="proto-nav-mark">nc</span>
              <span>novuscampo</span>
            </div>
            <div className="proto-nav-sub">Prototipo navegable · v0.2</div>
          </div>

          {sections.map(sec => (
            <div key={sec}>
              <div className="proto-nav-section">{sec}</div>
              {SCREENS.filter(s => s.section === sec).map(s => (
                <div
                  key={s.id}
                  className={'proto-nav-item' + (s.id === current ? ' active' : '')}
                  onClick={() => onNavigate(s.id)}
                >
                  <span className="proto-nav-item-num">{s.num}</span>
                  <span>{s.label}</span>
                </div>
              ))}
            </div>
          ))}

          <div className="proto-nav-footer">
            Use el menú lateral para saltar entre pantallas, o los botones dentro del prototipo para navegar como un usuario real.
            <br/><br/>
            Los botones de WhatsApp muestran un mensaje en lugar de abrir la app.
          </div>
        </aside>
      );
    }

    function App() {
      const [screen, setScreen] = React.useState('splash');
      const [history, setHistory] = React.useState([]);

      // Expose navigation globally for buttons inside the screens
      React.useEffect(() => {
        window.__nav = (s) => {
          if (!SCREENS.find(x => x.id === s)) {
            console.warn('Unknown screen:', s);
            return;
          }
          setHistory(h => [...h, screen]);
          setScreen(s);
        };
        window.__back = () => {
          setHistory(h => {
            if (h.length === 0) {
              setScreen('splash');
              return [];
            }
            const last = h[h.length - 1];
            setScreen(last);
            return h.slice(0, -1);
          });
        };
      }, [screen]);

      const current = SCREENS.find(s => s.id === screen);
      const stageHint = history.length > 0
        ? `← desde ${SCREENS.find(s => s.id === history[history.length - 1])?.label || 'inicio'}`
        : 'pantalla inicial';

      return (
        <div className="proto-layout">
          <DemoNavigator current={screen} onNavigate={(s) => { setScreen(s); setHistory([]); }} />
          <div className="proto-stage">
            <div className="proto-stage-header">
              <div>
                <div className="proto-stage-label">{current.section}</div>
                <div className="proto-stage-title">{current.num} · {current.label}</div>
              </div>
              <div className="proto-hint">{stageHint}</div>
            </div>

            {current.isDesktop ? (
              <div className="proto-desktop">
                {current.fn()}
              </div>
            ) : (
              <div className="proto-phone">
                <div className="proto-phone-inner">
                  {current.fn()}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
